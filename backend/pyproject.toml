[project]
name = "apply"
version = "0.1.0"
description = "Autonomous job application agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pydantic-ai-slim[openai,mcp]>=0.0.52",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "sse-starlette>=2.1.3",
    "langfuse>=2.57.0",
    "httpx>=0.28.0",
    "openai>=1.54.0",
    "python-multipart>=0.0.20",
    "scipy>=1.14.0",
    "fastmcp>=2.0.0",
    "chromadb>=1.5.8",
]

[project.scripts]
apply = "apply.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-recording>=0.13.2",
    "vcrpy>=6.0.2",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "rich>=13.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apply"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/apply/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# API route handlers intentionally use `Depends(...)` in defaults (FastAPI idiom).
"src/apply/api/routes_applications.py" = ["B008"]
"src/apply/api/routes_runs.py" = ["B008"]
# Tests group imports near the section they test, which is fine for readability.
"tests/*" = ["E402", "F811", "F401", "E741"]
# Eval Markdown tables + long f-strings — inherent line length, not hiding logic.
"eval/reports/markdown.py" = ["E501"]
"eval/runners/*.py" = ["E501"]
"tests/eval/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
